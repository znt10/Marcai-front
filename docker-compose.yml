services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: { context: ., target: dev }
    # `prisma generate` também aqui, não só no Dockerfile: o cliente gerado
    # mora em node_modules, que é um volume anônimo — o que a imagem gerou no
    # build fica escondido atrás dele. Gerar na subida garante que o cliente
    # acompanhe o schema.prisma montado do host.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL:     postgresql://brutus_owner:owner@db:5432/brutus
      DATABASE_URL_APP: postgresql://brutus_app:app@db:5432/brutus
      DATABASE_URL_ADMIN: postgresql://brutus_admin:admin@db:5432/brutus
      NEXT_PUBLIC_DOMINIO_BASE: localhost
      WATCHPACK_POLLING: "true"
      # Nome de serviço, resolvível só DENTRO da rede do compose — é por isso
      # que não mora no .env, ao lado das DATABASE_URL_HOST que existem
      # justamente porque host e contêiner veem endereços diferentes.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-brutus}
      # A MESMA chave que o serviço `evolution` exige como
      # AUTHENTICATION_API_KEY. Uma variável, dois consumidores: chave errada
      # é 401 silencioso (o envio é fire-and-forget), então o sintoma seria
      # "a mensagem não chega" sem erro em log nenhum.
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # Vêm do .env do host: credencial não fica escrita no compose.
      ADMIN_USUARIO: ${ADMIN_USUARIO}
      ADMIN_SENHA_HASH_B64: ${ADMIN_SENHA_HASH_B64}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db: { condition: service_healthy }

  # O que faz o lembrete existir. A rota `/api/cron/lembretes` estava escrita e
  # protegida desde a Etapa 1, e nada a chamava — a tela prometia ao cliente
  # "mandamos o lembrete 1h antes" e ninguém mandava.
  #
  # Processo separado, e não um cron dentro do Next, por duas razões: ele
  # sobrevive a reinício da aplicação, e `docker compose logs agendador`
  # responde "está rodando?" sem instrumentar nada.
  #
  # O tique é de 10 min (LEMBRETE_TIQUE_MIN) contra uma janela de 60: a
  # mensagem sai entre 50 e 60 minutos antes. Tique MAIOR que a janela perderia
  # agendamento — quem entra nela entre dois tiques nunca seria visto.
  agendador:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    environment:
      # `$$` escapa a interpolação do compose: quem expande é o shell de
      # dentro, então o segredo não fica escrito no comando do contêiner.
      CRON_SECRET: ${CRON_SECRET}
      # Para o healthcheck do WhatsApp no mesmo tique.
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-brutus}
    # Bate assim que sobe, e só então dorme: `docker compose up` dá o retorno
    # na hora em vez de dez minutos depois. Erro de curl não mata o laço —
    # app ainda subindo é normal.
    #
    # Vetor, e não `command: >`: em escalar dobrado do YAML, linha MAIS
    # indentada conserva a quebra em vez de virar espaço, e o comando chega
    # partido ao shell (`sh: -H: not found`).
    #
    # No MESMO tique, confere se o WhatsApp está de pé. Isto não é zelo: o
    # vínculo do WhatsApp cai sozinho (`Instance - LOGOUT` sem ninguém pedir), e
    # depois disso a Evolution responde 201 com `status: PENDING` para TUDO e
    # nada é entregue. Aconteceu, e passou quase duas horas sem ninguém ver —
    # o sintoma é cliente deixando de receber confirmação, que ninguém descobre
    # olhando tela.
    #
    # Reconectar exige o QR, que exige uma pessoa com o celular. O agendador não
    # conserta; ele grita, e é isso que faltava.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do echo "[agendador] $$(date -u +%H:%M:%S) $$(curl -sS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/lembretes || echo falhou)"; zap=$$(curl -sS -H "apikey: $$EVOLUTION_API_KEY" http://evolution:8080/instance/connectionState/$$EVOLUTION_INSTANCE || echo erro); case "$$zap" in *\"state\":\"open\"*) : ;; *) echo "[agendador] !!! WHATSAPP FORA DO AR: $$zap — rode: npm run whatsapp:qr" ;; esac; sleep 600; done'
    depends_on:
      app: { condition: service_started }

  # O telefone do produto. Confirmação, cancelamento, lembrete e convite de
  # barbeiro saem por aqui — sem este serviço, tudo isso cai no console.info do
  # app e o sistema funciona inteiro sem falar com ninguém.
  #
  # Versão PINADA: `latest` num serviço que guarda sessão de WhatsApp é convite
  # para uma atualização derrubar a conexão numa terça à tarde.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      # A parte que mais importa: aqui mora a credencial da sessão que o QR
      # gera. Sem o volume, todo `docker compose down` obriga a escanear o QR
      # de novo — em produção, é o telefone da barbearia caindo a cada deploy.
      - evolution_instances:/evolution/instances
    environment:
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}

      # O Postgres que já existe, com papel e banco próprios (docker/init-db.sql).
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: brutus
      # Só a instância é persistida. Todo o resto FICA DESLIGADO de propósito:
      # nós mandamos mensagem e consultamos se um número existe — nunca lemos
      # conversa. Ligado, isto guardaria mensagens, contatos, chats e histórico
      # de todo cliente de toda barbearia: um acervo de conversa alheia que o
      # produto não usa para nada.
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"

      # Sem Redis: um quarto contêiner para cachear o que uma instância única
      # resolve em memória é peso sem retorno.
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"

      DEL_INSTANCE: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      LOG_BAILEYS: error
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  evolution_instances:
