services:
  app:
    container_name: Marcai-front-app
    build: { context: ., target: dev }
    command: npm run dev
    environment:
      NEXT_PUBLIC_DOMINIO_BASE: localhost
      # Vazia = desligado. A saída para testar pelo celular sem DNS curinga:
      # com o slug de uma barbearia aqui, todo host SEM subdomínio cai nela,
      # e `http://<ip-da-máquina>:3000` funciona no aparelho. Precisa ser
      # IGUAL ao TENANT_PADRAO do .env do back — divergir faz um lado servir a
      # institucional e o outro a barbearia, no mesmo endereço.
      NEXT_PUBLIC_TENANT_PADRAO: ${TENANT_PADRAO:-}
      # So' a porta do Django — ver o comentario de NEXT_PUBLIC_API_URL no
      # .env.example. baseDe() (src/lib/api/client.ts) monta o host a partir
      # de `location` em tempo de chamada, nunca de uma origem fixa.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-8000}
      WATCHPACK_POLLING: "true"
      # Vem do .env do host: credencial não fica escrita no compose.
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks: [brutus]

networks:
  brutus:
    external: true
