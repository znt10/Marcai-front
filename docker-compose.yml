services:
  app:
    container_name: Marcai-front-app
    build: { context: ., target: dev }
    # `prisma generate` também aqui, não só no Dockerfile: o cliente gerado
    # mora em node_modules, que é um volume anônimo — o que a imagem gerou no
    # build fica escondido atrás dele. Gerar na subida garante que o cliente
    # acompanhe o schema.prisma montado do host.
    # Sem `prisma generate` e sem `migrate deploy`: o schema deixou de ser deste
    # lado na fatia 1 (o Django virou dono) e o Prisma saiu do repo na fatia 4.
    # O `migrate deploy` daqui chegou a competir com o `migrate` do entrypoint
    # do back pelo MESMO banco.
    command: npm run dev
    environment:
      NEXT_PUBLIC_DOMINIO_BASE: localhost
      # Onde o Django atende para o SERVIDOR do Next (server components), que
      # roda dentro da rede e nao enxerga `<slug>.localhost`. O NAVEGADOR
      # continua chegando por NEXT_PUBLIC_API_URL abaixo, montado a partir do
      # `location` da pagina — sao dois caminhos, de proposito.
      #
      # Nome de servico, resolvivel so DENTRO da rede do compose: mesma razao
      # de EVOLUTION_API_URL nao morar no .env.
      API_URL_INTERNA: http://api:8000
      # So' a porta do Django — ver o comentario de NEXT_PUBLIC_API_URL no
      # .env.example. baseDe() (src/lib/api/client.ts) monta o host a partir
      # de `location` em tempo de chamada, nunca de uma origem fixa.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-8000}
      WATCHPACK_POLLING: "true"
      # Nome de serviço, resolvível só DENTRO da rede do compose — é por isso
      # que não mora no .env, ao lado das DATABASE_URL_HOST que existem
      # justamente porque host e contêiner veem endereços diferentes.
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-brutus}
      # A MESMA chave que o serviço `evolution` exige como
      # AUTHENTICATION_API_KEY. Uma variável, dois consumidores: chave errada
      # é 401 silencioso (o envio é fire-and-forget), então o sintoma seria
      # "a mensagem não chega" sem erro em log nenhum.
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      # Vêm do .env do host: credencial não fica escrita no compose.
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
    networks: [brutus]

networks:
  brutus:
    external: true
