services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: { context: ., target: dev }
    # `prisma generate` também aqui, não só no Dockerfile: o cliente gerado
    # mora em node_modules, que é um volume anônimo — o que a imagem gerou no
    # build fica escondido atrás dele. Gerar na subida garante que o cliente
    # acompanhe o schema.prisma montado do host.
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    environment:
      DATABASE_URL:     postgresql://brutus_owner:owner@db:5432/brutus
      DATABASE_URL_APP: postgresql://brutus_app:app@db:5432/brutus
      DATABASE_URL_ADMIN: postgresql://brutus_admin:admin@db:5432/brutus
      NEXT_PUBLIC_DOMINIO_BASE: localhost
      WATCHPACK_POLLING: "true"
      # Vêm do .env do host: credencial não fica escrita no compose.
      ADMIN_USUARIO: ${ADMIN_USUARIO}
      ADMIN_SENHA_HASH_B64: ${ADMIN_SENHA_HASH_B64}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
    ports: ["3000:3000"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
